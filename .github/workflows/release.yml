name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Tidy modules
        run: |
          go mod tidy
          go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MCPB bundles
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          chmod +x scripts/build-mcpb.sh
          ./scripts/build-mcpb.sh "$VERSION" "dist"

      - name: Upload MCPB bundles to release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          for mcpb in mcpb-build/*.mcpb; do
            if [[ -f "$mcpb" ]]; then
              echo "Uploading: $(basename "$mcpb")"
              gh release upload "$TAG" "$mcpb" --repo kaneg/k8s-mcp-go --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate server.json with MCPB packages
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          TAG=${GITHUB_REF#refs/tags/}
          BASE_URL="https://github.com/kaneg/k8s-mcp-go/releases/download/${TAG}"

          # Build packages JSON array
          PACKAGES="[]"
          for mcpb in mcpb-build/*.mcpb; do
            if [[ -f "$mcpb" ]]; then
              BASENAME=$(basename "$mcpb")
              HASH=$(openssl dgst -sha256 "$mcpb" | awk '{print $2}')
              # Extract platform hint from filename: k8s-mcp-go_VERSION_os_arch.mcpb
              PLATFORM=$(echo "$BASENAME" | sed "s/k8s-mcp-go_${VERSION}_//" | sed 's/\.mcpb$//')
              URL="${BASE_URL}/${BASENAME}"

              PACKAGES=$(echo "$PACKAGES" | jq \
                --arg url "$URL" \
                --arg hash "$HASH" \
                --arg hint "$PLATFORM" \
                '. += [{
                  "registryType": "mcpb",
                  "identifier": $url,
                  "fileSha256": $hash,
                  "transport": {"type": "stdio"},
                  "runtimeHint": $hint
                }]')
            fi
          done

          # Generate final server.json
          jq --arg v "$VERSION" --argjson pkgs "$PACKAGES" \
            '.version = $v | .packages = $pkgs' \
            server.json > tmp && mv tmp server.json

          echo "=== Generated server.json ==="
          cat server.json

      - name: Download MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
