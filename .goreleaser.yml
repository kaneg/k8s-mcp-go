project_name: k8s-mcp-go

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: kaneg
    name: k8s-mcp-go

dockers:
  - image_templates:
      - "ghcr.io/kaneg/k8s-mcp-go:{{ .Version }}-amd64"
    use: buildx
    goarch: amd64
    goos: linux
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=io.modelcontextprotocol.server.name=io.github.kaneg/k8s-mcp-go"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/kaneg/k8s-mcp-go"
  - image_templates:
      - "ghcr.io/kaneg/k8s-mcp-go:{{ .Version }}-arm64"
    use: buildx
    goarch: arm64
    goos: linux
    dockerfile: Dockerfile
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=io.modelcontextprotocol.server.name=io.github.kaneg/k8s-mcp-go"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/kaneg/k8s-mcp-go"

docker_manifests:
  - name_template: "ghcr.io/kaneg/k8s-mcp-go:{{ .Version }}"
    image_templates:
      - "ghcr.io/kaneg/k8s-mcp-go:{{ .Version }}-amd64"
      - "ghcr.io/kaneg/k8s-mcp-go:{{ .Version }}-arm64"
  - name_template: "ghcr.io/kaneg/k8s-mcp-go:latest"
    image_templates:
      - "ghcr.io/kaneg/k8s-mcp-go:{{ .Version }}-amd64"
      - "ghcr.io/kaneg/k8s-mcp-go:{{ .Version }}-arm64"
